name: Bug report
description: Report a problem with HydroDrop
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. See [installation troubleshooting](https://github.com/ThermoTrack/HydroDrop/blob/main/docs/installation.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce and expected vs actual behaviour
    validations:
      required: true
  - type: input
    id: qgis-version
    attributes:
      label: QGIS version
      placeholder: e.g. 4.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11
    validations:
      required: true
  - type: input
    id: richdem
    attributes:
      label: richdem2 version
      placeholder: python -c "import richdem; print(richdem.__version__)"
